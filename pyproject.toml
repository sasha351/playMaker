[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localdj"
version = "0.1.0"
description = "Smart local-first music playlist generator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "mutagen>=1.47",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "aubio>=0.4",
    "pyacoustid>=1.3",
]
tui = [
    "textual>=0.52",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
dj = "localdj.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["localdj*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "interactive: marks tests requiring human input",
    "stress: marks stress tests",
    "accuracy: marks audio accuracy tests",
]
